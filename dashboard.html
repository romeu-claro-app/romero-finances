<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM — Romero Finances</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
<style>
:root{
  --blue:#2B2FD4;--blue-dark:#1A1B8F;--blue-pale:#EEF0FF;--blue-light:#4F54E8;
  --green:#16a34a;--green-pale:#dcfce7;
  --orange:#f97316;--orange-pale:#fff3e0;
  --purple:#7c3aed;--purple-pale:#ede9fe;
  --gray:#6b7280;--gray-pale:#f3f4f6;
  --red:#dc2626;--red-pale:#fee2e2;
  --amber:#d97706;--amber-pale:#fef3c7;
  --bg:#f0f0ee;--card:#fff;--border:#e0e0e0;
  --text:#1a1a2e;--muted:#666;--light:#999;
  --dark:#0B0C1A;--top:56px;--rad:12px;--rad-sm:8px;--sidebar:210px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:0.9rem;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ── LOGIN ─────────────────────────────────────────────── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:48px 40px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center;}
.login-logo img{width:36px;height:36px;object-fit:contain;}
.login-logo span{font-weight:700;font-size:1.05rem;color:var(--text);}
.login-title{font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:6px;}
.login-sub{text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:28px;}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.login-field label{font-size:0.82rem;font-weight:600;color:var(--muted);}
.login-field input{border:1.5px solid var(--border);border-radius:var(--rad-sm);padding:10px 14px;font-size:0.92rem;outline:none;transition:border-color .18s;}
.login-field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,47,212,.1);}
.login-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:var(--rad-sm);padding:11px;font-size:0.95rem;font-weight:600;margin-top:4px;transition:background .18s;}
.login-btn:hover{background:var(--blue-dark);}
.login-error{display:none;background:var(--red-pale);color:var(--red);border-radius:var(--rad-sm);padding:9px 14px;font-size:0.83rem;margin-top:10px;text-align:center;}

/* ── APP SHELL ──────────────────────────────────────────── */
#app{display:none;min-height:100vh;}

/* ── SIDEBAR ────────────────────────────────────────────── */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--dark);color:#C5C6D8;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;}
.sidebar-brand img{width:30px;height:30px;object-fit:contain;}
.sidebar-brand-name{font-family:'Playfair Display',serif;font-weight:700;font-size:0.98rem;color:#fff;line-height:1.1;}
.sidebar-brand-sub{font-size:0.66rem;color:#5A5B72;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:2px;}
.nav-group{margin-top:16px;}
.nav-group-label{font-size:0.64rem;font-weight:700;color:#5A5B72;text-transform:uppercase;letter-spacing:.12em;padding:0 8px;margin-bottom:7px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:#C5C6D8;font-size:0.86rem;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s;}
.nav-item i{font-size:1.1rem;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:var(--blue);color:#fff;}
.sidebar-bottom{margin-top:auto;padding-top:16px;}
.sidebar-backdrop{display:none;}

/* ── CONTENT ────────────────────────────────────────────── */
.content{flex:1;min-width:0;display:flex;flex-direction:column;}
.content-top{height:var(--top);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40;}
.content-top h1{font-family:'Playfair Display',serif;font-size:1.08rem;font-weight:700;flex:1;}
.hamburger{display:none;background:none;border:none;font-size:1.4rem;color:var(--text);padding:0;line-height:1;}

.btn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:600;border-radius:var(--rad-sm);cursor:pointer;transition:background .15s,color .15s,border-color .15s;font-size:0.85rem;white-space:nowrap;}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:8px 16px;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--border);padding:7px 14px;}
.btn-ghost:hover{background:var(--gray-pale);color:var(--text);}
.btn-danger{background:var(--red-pale);color:var(--red);border:1px solid rgba(220,38,38,.2);padding:7px 14px;}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:5px 11px;font-size:0.8rem;}
.btn-xs{padding:4px 9px;font-size:0.76rem;}

/* ── MAIN ───────────────────────────────────────────────── */
.main{padding:24px;flex:1;position:relative;max-width:1100px;width:100%;margin:0 auto;}

/* ── STATS ──────────────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s;user-select:none;}
.stat-card:hover{border-color:var(--blue);box-shadow:0 2px 12px rgba(43,47,212,.08);}
.stat-card.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,47,212,.12);background:var(--blue-pale);}
.stat-label{font-size:0.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.stat-num{font-size:2rem;font-weight:700;line-height:1;}
.stat-card.active .stat-num{color:var(--blue);}

/* ── FILTER BAR ─────────────────────────────────────────── */
.filter-bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-bar input,.filter-bar select{border:1px solid var(--border);border-radius:var(--rad-sm);padding:7px 12px;font-size:0.85rem;color:var(--text);background:var(--card);outline:none;transition:border-color .15s;}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--blue);}
.filter-bar input{min-width:220px;}
.filter-bar select{min-width:180px;}

/* ── MASS ACTIONS ───────────────────────────────────────── */
.mass-bar{display:none;align-items:center;gap:10px;background:var(--blue-pale);border:1px solid rgba(43,47,212,.2);border-radius:var(--rad-sm);padding:9px 16px;margin-bottom:12px;flex-wrap:wrap;}
.mass-bar.visible{display:flex;}
.mass-bar-info{font-size:0.85rem;font-weight:600;color:var(--blue);margin-right:4px;}

/* ── TABLE ──────────────────────────────────────────────── */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead tr{background:#fafafa;border-bottom:1px solid var(--border);}
th{padding:10px 14px;text-align:left;font-size:0.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid #f0f0ee;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafafa;}
tbody tr.selected{background:var(--blue-pale);}
.col-check{width:40px;}
.col-actions{width:80px;text-align:right;}
.col-statut{width:130px;}
.col-date{width:100px;}
.col-tel{width:140px;}
.lead-name{font-weight:600;font-size:0.88rem;}
.lead-email{font-size:0.78rem;color:var(--muted);}
.lead-produit-badge{display:inline-block;font-size:0.72rem;font-weight:600;padding:2px 8px;border-radius:50px;background:var(--gray-pale);color:var(--muted);}

/* ── STATUT BADGES ──────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:0.76rem;font-weight:600;padding:3px 10px;border-radius:50px;white-space:nowrap;}
.badge-nouveau{background:var(--blue-pale);color:var(--blue);}
.badge-contacte{background:var(--orange-pale);color:var(--orange);}
.badge-proposition{background:var(--purple-pale);color:var(--purple);}
.badge-converti{background:var(--green-pale);color:var(--green);}
.badge-perdu{background:var(--gray-pale);color:var(--gray);}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}

/* ── PIPELINE ───────────────────────────────────────────── */
.pipeline-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
.pipeline-col{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden;}
.pipeline-col-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pipeline-col-title{font-size:0.82rem;font-weight:700;display:flex;align-items:center;gap:7px;}
.pipeline-col-count{font-size:0.72rem;background:var(--gray-pale);color:var(--muted);padding:1px 7px;border-radius:50px;font-weight:600;}
.pipeline-cards{padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px;}
.pipeline-cards.drag-over{background:var(--blue-pale);border-radius:0 0 var(--rad) var(--rad);}
.pipeline-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rad-sm);padding:12px 14px;cursor:grab;transition:box-shadow .15s;user-select:none;}
.pipeline-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);}
.pipeline-card.dragging{opacity:.5;cursor:grabbing;}
.pipeline-card-name{font-weight:600;font-size:0.85rem;margin-bottom:3px;}
.pipeline-card-sub{font-size:0.76rem;color:var(--muted);}
.pipeline-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.src-tag{font-size:0.66rem;font-weight:700;padding:1px 6px;border-radius:50px;text-transform:uppercase;letter-spacing:.04em;}
.src-tag.web{background:var(--blue-pale);color:var(--blue);}
.src-tag.ads{background:var(--green-pale);color:var(--green);}

/* ── FICHE ──────────────────────────────────────────────── */
.fiche-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:0;overflow:hidden;}
.fiche-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.fiche-header-left h2{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;}
.fiche-header-meta{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;}
.fiche-header-meta span{font-size:0.82rem;color:var(--muted);display:flex;align-items:center;gap:4px;}
.fiche-header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.fiche-body{display:grid;grid-template-columns:1fr 280px;gap:0;}
.fiche-main{padding:24px;}
.fiche-side{padding:24px;border-left:1px solid var(--border);}
.fiche-docs{padding:24px;border-top:1px solid var(--border);}
.fiche-section{margin-bottom:24px;}
.fiche-section-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.fiche-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fiche-field{display:flex;flex-direction:column;gap:4px;}
.fiche-field label{font-size:0.76rem;font-weight:600;color:var(--muted);}
.fiche-field span,.fiche-field input,.fiche-field select{font-size:0.88rem;color:var(--text);}
.fiche-field input,.fiche-field select{border:1px solid var(--border);border-radius:var(--rad-sm);padding:7px 10px;outline:none;width:100%;transition:border-color .15s;}
.fiche-field input:focus,.fiche-field select:focus{border-color:var(--blue);}
textarea.notes-area{width:100%;border:1px solid var(--border);border-radius:var(--rad-sm);padding:10px;font-size:0.87rem;resize:vertical;min-height:100px;outline:none;font-family:inherit;line-height:1.5;transition:border-color .15s;}
textarea.notes-area:focus{border-color:var(--blue);}
.historique-list{display:flex;flex-direction:column;gap:8px;}
.hist-item{display:flex;gap:10px;align-items:flex-start;}
.hist-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;margin-top:5px;}
.hist-dot.create{background:var(--blue);}
.hist-dot.statut{background:var(--orange);}
.hist-dot.note{background:var(--green);}
.hist-text{font-size:0.82rem;color:var(--text);}
.hist-date{font-size:0.74rem;color:var(--light);}

/* ── CALENDRIER ─────────────────────────────────────────── */
.cal-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.cal-nav{display:flex;gap:6px;}
.cal-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;min-width:170px;text-transform:capitalize;}
.cal-views{display:flex;background:var(--card);border:1px solid var(--border);border-radius:var(--rad-sm);overflow:hidden;}
.cal-view-btn{padding:7px 15px;background:none;border:none;font-size:0.82rem;font-weight:600;color:var(--muted);transition:background .15s,color .15s;}
.cal-view-btn:hover{color:var(--text);}
.cal-view-btn.active{background:var(--blue);color:#fff;}
.cal-month{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:#fafafa;border-bottom:1px solid var(--border);}
.cal-weekday{padding:8px;text-align:center;font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-cell{min-height:96px;border-right:1px solid #f0f0ee;border-bottom:1px solid #f0f0ee;padding:6px;cursor:pointer;transition:background .12s;display:flex;flex-direction:column;gap:3px;overflow:hidden;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-cell:hover{background:#fafafa;}
.cal-cell.out{background:#fafafa;}
.cal-cell.out .cal-cell-num{color:var(--light);}
.cal-cell.today .cal-cell-num{background:var(--blue);color:#fff;border-radius:50%;}
.cal-cell-num{font-size:0.78rem;font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.cal-chip{font-size:0.7rem;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--blue-pale);color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.cal-chip:hover{background:var(--blue);color:#fff;}
.cal-week-scroll{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);}
.cal-week{display:grid;grid-template-columns:54px repeat(7,minmax(90px,1fr));min-width:680px;}
.cal-week-corner{background:#fafafa;border-bottom:1px solid var(--border);}
.cal-week-head{background:#fafafa;border-bottom:1px solid var(--border);border-left:1px solid #f0f0ee;padding:7px 4px;text-align:center;font-size:0.72rem;font-weight:600;color:var(--muted);}
.cal-week-head.today{color:var(--blue);}
.cal-week-head b{font-size:0.95rem;color:var(--text);}
.cal-hour-label{font-size:0.68rem;color:var(--muted);padding:4px;text-align:right;border-bottom:1px solid #f0f0ee;}
.cal-slot{min-height:40px;border-left:1px solid #f0f0ee;border-bottom:1px solid #f0f0ee;padding:2px;cursor:pointer;display:flex;flex-direction:column;gap:2px;}
.cal-slot:hover{background:#fafafa;}
.cal-day{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden;}
.cal-day-row{display:grid;grid-template-columns:62px 1fr;border-bottom:1px solid #f0f0ee;min-height:48px;}
.cal-day-row:last-child{border-bottom:none;}
.cal-day-hour{padding:7px;font-size:0.72rem;color:var(--muted);border-right:1px solid #f0f0ee;}
.cal-day-events{padding:4px 6px;display:flex;flex-direction:column;gap:5px;cursor:pointer;}
.cal-event{background:var(--blue-pale);border-left:3px solid var(--blue);border-radius:5px;padding:6px 10px;cursor:pointer;}
.cal-event:hover{background:#e2e5ff;}
.cal-event-time{font-size:0.72rem;font-weight:700;color:var(--blue);}
.cal-event-title{font-size:0.84rem;font-weight:600;}
.cal-event-sub{font-size:0.74rem;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:1px;}

/* ── CHARTS ─────────────────────────────────────────────── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:18px 20px;}
.chart-card h3{font-family:'Playfair Display',serif;font-size:0.98rem;font-weight:600;margin-bottom:14px;}

/* ── MODAL ──────────────────────────────────────────────── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border-radius:var(--rad);padding:28px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.15);max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-title{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:600;}
.modal-close{background:none;border:none;font-size:1.3rem;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;transition:background .15s;line-height:1;}
.modal-close:hover{background:var(--gray-pale);}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-field{display:flex;flex-direction:column;gap:5px;}
.modal-field.full{grid-column:1/-1;}
.modal-field label{font-size:0.8rem;font-weight:600;color:var(--muted);}
.modal-field input,.modal-field select,.modal-field textarea{border:1.5px solid var(--border);border-radius:var(--rad-sm);padding:9px 12px;font-size:0.88rem;outline:none;width:100%;font-family:inherit;transition:border-color .15s;}
.modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{border-color:var(--blue);}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.lead-search-wrap{position:relative;}
.lead-search-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--rad-sm);max-height:190px;overflow-y:auto;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none;margin-top:3px;}
.lead-search-list.show{display:block;}
.lead-search-opt{padding:8px 12px;cursor:pointer;font-size:0.84rem;}
.lead-search-opt:hover{background:var(--blue-pale);}
.lead-selected{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--blue-pale);border-radius:var(--rad-sm);padding:8px 12px;margin-top:6px;font-size:0.84rem;font-weight:500;}
.lead-selected span{display:flex;align-items:center;gap:6px;}

/* ── EMPTY ──────────────────────────────────────────────── */
.empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
.empty-state i{font-size:2.5rem;margin-bottom:12px;opacity:.3;}
.empty-state p{font-size:0.9rem;}

/* ── CHECKBOX ───────────────────────────────────────────── */
input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;}

/* ── LOADING ─────────────────────────────────────────────── */
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── DOCS SECTION ────────────────────────────────────────── */
.docs-loading{color:var(--muted);font-size:0.85rem;display:flex;align-items:center;gap:8px;padding:4px 0;}
.docs-folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.docs-folder{margin-bottom:0;background:var(--gray-pale);border:1px solid var(--border);border-radius:var(--rad-sm);padding:12px;}
.docs-folder-title{font-size:0.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px;}
.docs-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}

<script>
/* ════════════════════════════════════════════════════════════
   CONFIG — SUPABASE
   ════════════════════════════════════════════════════════════ */
var SUPABASE_URL = 'https://npfvppuprhbycbhmthxi.supabase.co';
var SUPABASE_KEY = 'sb_publishable_cdQew7JvhMuBpj3aU6LDCg_gU2D3pya';
var TABLES = [
  { table: 'leads_credit',                   produit: 'credit' },
  { table: 'leads_assurance',                produit: 'assurance' },
  { table: 'leads_assurance_nouveau_arrive', produit: 'assurance-nouveau-arrive' },
  { table: 'leads_assurance_prenatale',      produit: 'assurance-prenatale' },
  { table: 'leads_pilier',                   produit: 'pilier' },
  { table: 'leads_patrimoine',               produit: 'patrimoine' }
];
var STATUT_NORM = {
  'Nouveau':'nouveau','Contacté':'contacte','contacté':'contacte',
  'Proposition':'proposition','Converti':'converti','Perdu':'perdu',
  'nouveau':'nouveau','contacte':'contacte','proposition':'proposition',
  'converti':'converti','perdu':'perdu'
};

/* ── State ─────────────────────────────────────────────── */
var S = {
  leads:[], rdvs:[], view:'web', returnView:'web', selected:[],
  filter:{statut:'',produit:'',search:''},
  statFilter:'', currentLeadId:null, draggedId:null,
  calView:'mois', calCursor:new Date(),
  editingRdvId:null, rdvLead:null
};

/* ── Helpers ────────────────────────────────────────────── */
var PRODUIT_LABELS = {
  credit:'Crédit privé', assurance:'Assurance maladie',
  'assurance-nouveau-arrive':'Ass. nouveau arrivé',
  'assurance-prenatale':'Ass. pré-natale',
  pilier:'3ème pilier', patrimoine:'Choses & Biens'
};
var STATUT_LABELS = {
  nouveau:'Nouveau', contacte:'Contacté', proposition:'Proposition',
  converti:'Converti', perdu:'Perdu'
};
var MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
var JOURS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
var JOURS_LONG = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

function idQ(id){ return typeof id==='string'?"'"+id+"'":id; }
function badge(statut){
  return '<span class="badge badge-'+statut+'"><span class="badge-dot"></span>'+(STATUT_LABELS[statut]||statut)+'</span>';
}
function produitBadge(p){
  return '<span class="lead-produit-badge">'+(PRODUIT_LABELS[p]||p)+'</span>';
}
function fmtDate(d){
  if(!d) return '—';
  var p=d.slice(0,10).split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
function leadSource(l){ return l._source==='ads'?'ads':'web'; }
function currentSource(){ return S.view==='web'?'web':(S.view==='ads'?'ads':null); }
function filteredLeads(){
  var src=currentSource();
  return S.leads.filter(function(l){
    if(src && leadSource(l)!==src) return false;
    if(S.statFilter==='contacte'&&l.statut!=='contacte') return false;
    if(S.statFilter==='converti'&&l.statut!=='converti') return false;
    if(S.statFilter==='followup'&&!l.followup) return false;
    if(S.filter.produit&&l.produit!==S.filter.produit) return false;
    if(S.filter.statut&&l.statut!==S.filter.statut) return false;
    if(S.filter.search){
      var q=S.filter.search.toLowerCase();
      if(!(l.nom+' '+l.prenom+' '+l.email+' '+l.telephone).toLowerCase().includes(q)) return false;
    }
    return true;
  });
}
function normalizeLead(row, produit){
  return {
    id:        row.id,
    prenom:    row.prenom    ||'',
    nom:       row.nom       ||'',
    email:     row.email     ||'',
    telephone: row.telephone ||'',
    produit:   produit,
    _source:   'web',
    statut:    STATUT_NORM[row.statut]||(row.statut?row.statut.toLowerCase():'nouveau'),
    date:      (row.created_at||'').slice(0,10),
    followup:  row.follow_up_date||row.followup||'',
    notes:     row.notes||row.commentaire||'',
    historique:[{d:(row.created_at||'').slice(0,10),a:'Lead créé',t:'create'}],
    raw:       row
  };
}
function normalizeLeadAds(row){
  var dados=row.dados||{};
  if(typeof dados==='string'){ try{dados=JSON.parse(dados);}catch(e){dados={};} }
  return {
    id:        row.id,
    prenom:    row.prenom    ||'',
    nom:       row.nom       ||'',
    email:     row.email     ||'',
    telephone: row.telephone ||'',
    produit:   row.produit   ||'',
    _source:   'ads',
    statut:    STATUT_NORM[row.statut]||(row.statut?row.statut.toLowerCase():'nouveau'),
    date:      (row.created_at||'').slice(0,10),
    followup:  row.follow_up_date||'',
    notes:     row.notes||'',
    dados:     dados,
    historique:[{d:(row.created_at||'').slice(0,10),a:'Lead créé',t:'create'}],
    raw:       row
  };
}
function saveData(){
  try{
    var overrides={};
    S.leads.forEach(function(l){
      if(l._dirty) overrides[l.id]={statut:l.statut,notes:l.notes,followup:l.followup};
    });
    localStorage.setItem('rf_overrides',JSON.stringify(overrides));
    localStorage.setItem('rf_local',JSON.stringify(S.leads.filter(function(l){return l._local;})));
  }catch(e){}
}
function applyLocalState(leads){
  try{
    var overrides=JSON.parse(localStorage.getItem('rf_overrides')||'{}');
    leads.forEach(function(l){
      if(overrides[l.id]){
        if(overrides[l.id].statut)   l.statut=overrides[l.id].statut;
        if(overrides[l.id].notes!=null) l.notes=overrides[l.id].notes;
        if(overrides[l.id].followup) l.followup=overrides[l.id].followup;
        l._dirty=true;
      }
    });
  }catch(e){}
  try{
    var local=JSON.parse(localStorage.getItem('rf_local')||'[]');
    local.forEach(function(l){if(!l._source)l._source='web';leads.unshift(l);});
  }catch(e){}
}

/* ── Supabase fetch ─────────────────────────────────────── */
function showSpinner(){document.getElementById('loading-overlay').style.display='flex';}
function hideSpinner(){document.getElementById('loading-overlay').style.display='none';}
function loadFromSupabase(){
  showSpinner();
  var headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};
  var promises=TABLES.map(function(t){
    return fetch(SUPABASE_URL+'/rest/v1/'+t.table+'?select=*&order=created_at.desc',{headers:headers})
      .then(function(r){return r.ok?r.json():[];})
      .then(function(rows){return rows.map(function(row){return normalizeLead(row,t.produit);});})
      .catch(function(){return[];});
  });
  // Leads Ads — unified "leads" table
  promises.push(
    fetch(SUPABASE_URL+'/rest/v1/leads?select=*&order=created_at.desc',{headers:headers})
      .then(function(r){return r.ok?r.json():[];})
      .then(function(rows){return rows.map(normalizeLeadAds);})
      .catch(function(){return[];})
  );
  return Promise.all(promises).then(function(results){
    var all=[].concat.apply([],results);
    all.sort(function(a,b){return b.date.localeCompare(a.date);});
    applyLocalState(all);
    S.leads=all;
    hideSpinner();
  }).catch(function(){hideSpinner();});
}
function loadRdvs(){
  var headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};
  return fetch(SUPABASE_URL+'/rest/v1/rendezvous?select=*&order=date_rdv.asc',{headers:headers})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(rows){S.rdvs=rows||[];})
    .catch(function(){S.rdvs=[];});
}

/* ════════════════════════════════════════════════════════════
   AUTH
   ════════════════════════════════════════════════════════════ */
var PWD='RF2026admin';
function boot(){
  loadFromSupabase().then(function(){return loadRdvs();}).then(function(){render();}).catch(function(){render();});
}
function showApp(){
  document.getElementById('login-screen').style.display='none';
  var a=document.getElementById('app');
  a.style.display='flex';
}
function checkAuth(){
  if(sessionStorage.getItem('rf_auth')==='1'){
    showApp(); boot();
  }
}
function doLogin(e){
  e.preventDefault();
  if(document.getElementById('pwd').value===PWD){
    sessionStorage.setItem('rf_auth','1');
    showApp(); boot();
  }else{
    var err=document.getElementById('login-error');
    err.style.display='block';
    setTimeout(function(){err.style.display='none';},3000);
    document.getElementById('pwd').value='';
  }
}
function doLogout(){
  sessionStorage.removeItem('rf_auth');
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pwd').value='';
  closeSidebar();
}

/* ════════════════════════════════════════════════════════════
   NAVIGATION
   ════════════════════════════════════════════════════════════ */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('show');
}
function navTo(view){
  S.view=view;
  if(view!=='fiche'){
    S.returnView=view;
    S.currentLeadId=null;
    S.selected=[];
    S.filter={statut:'',produit:'',search:''};
    S.statFilter='';
    var si=document.getElementById('search-input'); if(si) si.value='';
    var fp=document.getElementById('filter-produit'); if(fp) fp.value='';
  }
  closeSidebar();
  render();
}
function setSidebarActive(){
  var v = S.view==='fiche' ? (S.returnView||'web') : S.view;
  document.querySelectorAll('.nav-item[data-view]').forEach(function(b){
    b.classList.toggle('active', b.dataset.view===v);
  });
}
function setPageTitle(){
  var titles={web:'Leads Web',ads:'Leads Ads',pipeline:'Pipeline',calendrier:'Calendrier',stats:'Statistiques'};
  var t=titles[S.view];
  if(S.view==='fiche'){
    var l=S.leads.find(function(x){return x.id===S.currentLeadId;});
    t=l?(l.prenom+' '+l.nom):'Fiche';
  }
  document.getElementById('page-title').textContent=t||'CRM';
}

/* ════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════ */
function render(){
  setSidebarActive();
  setPageTitle();
  var isLeads=(S.view==='web'||S.view==='ads');
  document.getElementById('stats-row').style.display = isLeads?'':'none';
  document.getElementById('filter-bar').style.display = isLeads?'':'none';

  // Set container visibility first so charts/layout measure real dimensions
  var active = isLeads ? 'liste' : S.view;
  ['liste','pipeline','calendrier','stats','fiche'].forEach(function(v){
    document.getElementById('view-'+v).style.display = (v===active)?'':'none';
  });

  if(isLeads){ renderStats(); renderListe(); }
  if(S.view==='pipeline')   renderPipeline();
  if(S.view==='calendrier') renderCalendrier();
  if(S.view==='stats')      renderStatsPage();
  if(S.view==='fiche')      renderFiche();

  updateMassBar();
  updateClearBtn();
}

/* ── Stats cards (leads list views) ─────────────────────── */
function renderStats(){
  var src=currentSource();
  var all=S.leads.filter(function(l){return leadSource(l)===src;});
  var data=[
    {key:'',label:'Total leads',num:all.length},
    {key:'contacte',label:'Contactés',num:all.filter(function(l){return l.statut==='contacte';}).length},
    {key:'converti',label:'Convertis',num:all.filter(function(l){return l.statut==='converti';}).length},
    {key:'followup',label:'Follow-up',num:all.filter(function(l){return !!l.followup;}).length},
  ];
  var html=data.map(function(d){
    var active=(S.statFilter===d.key&&d.key!=='')||(S.statFilter===''&&d.key==='');
    return '<div class="stat-card'+(active?' active':'')+'" onclick="setStatFilter(\''+d.key+'\')">'
      +'<div class="stat-label">'+d.label+'</div>'
      +'<div class="stat-num">'+d.num+'</div>'
      +'</div>';
  }).join('');
  document.getElementById('stats-row').innerHTML=html;
}
function setStatFilter(key){
  S.statFilter=(S.statFilter===key&&key!=='')?'':key;
  S.selected=[];
  render();
}

/* ── Filters ────────────────────────────────────────────── */
function onFilter(){
  S.filter.search=document.getElementById('search-input').value;
  S.filter.produit=document.getElementById('filter-produit').value;
  S.selected=[];
  updateClearBtn();
  if(S.view==='web'||S.view==='ads') renderListe();
  updateMassBar();
}
function clearFilters(){
  S.filter={statut:'',produit:'',search:''};
  S.statFilter='';
  document.getElementById('search-input').value='';
  document.getElementById('filter-produit').value='';
  render();
}
function updateClearBtn(){
  var active=S.filter.search||S.filter.produit||S.statFilter;
  var btn=document.getElementById('clear-btn');
  if(btn) btn.style.display=active?'':'none';
}

/* ── Mass bar ───────────────────────────────────────────── */
function updateMassBar(){
  var mb=document.getElementById('mass-bar');
  if(S.selected.length>0&&(S.view==='web'||S.view==='ads')){
    mb.classList.add('visible');
    document.getElementById('mass-count').textContent=S.selected.length+' lead'+(S.selected.length>1?'s':'')+' sélectionné'+(S.selected.length>1?'s':'');
  }else{
    mb.classList.remove('visible');
  }
}

/* ════════════════════════════════════════════════════════════
   LISTE
   ════════════════════════════════════════════════════════════ */
function renderListe(){
  var leads=filteredLeads();
  var el=document.getElementById('view-liste');
  if(leads.length===0){
    el.innerHTML='<div class="table-wrap"><div class="empty-state"><i class="ti ti-users"></i><p>Aucun lead trouvé avec ces filtres.</p></div></div>';
    return;
  }
  var allSel=leads.length>0&&leads.every(function(l){return S.selected.includes(l.id);});
  var someSel=leads.some(function(l){return S.selected.includes(l.id);});
  var html='<div class="table-wrap"><table><thead><tr>'
    +'<th class="col-check"><input type="checkbox" id="chk-all" '+(allSel?'checked':'')
    +' onclick="toggleAll()" title="'+(allSel?'Tout déselectionner':'Tout sélectionner')+'" /></th>'
    +'<th>Nom &amp; email</th><th>Produit</th><th class="col-tel">Téléphone</th>'
    +'<th class="col-statut">Statut</th><th class="col-date">Date</th><th class="col-actions"></th>'
    +'</tr></thead><tbody>';
  leads.forEach(function(l){
    var sel=S.selected.includes(l.id);
    var qi=idQ(l.id);
    html+='<tr class="'+(sel?'selected':'')+'" onclick="handleRowClick(event,'+qi+')">'
      +'<td class="col-check" onclick="event.stopPropagation()"><input type="checkbox" '+(sel?'checked':'')+' onchange="toggleSelect('+qi+')" /></td>'
      +'<td><div class="lead-name">'+esc(l.prenom)+' '+esc(l.nom)+'</div><div class="lead-email">'+esc(l.email)+'</div></td>'
      +'<td>'+produitBadge(l.produit)+'</td>'
      +'<td>'+esc(l.telephone||'—')+'</td>'
      +'<td>'+badge(l.statut)+'</td>'
      +'<td>'+fmtDate(l.date)+'</td>'
      +'<td class="col-actions" onclick="event.stopPropagation()">'
      +'<button class="btn btn-ghost btn-xs" onclick="openFiche('+qi+')"><i class="ti ti-eye"></i> Voir</button>'
      +'</td></tr>';
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;
  var chkAll=document.getElementById('chk-all');
  if(chkAll&&someSel&&!allSel) chkAll.indeterminate=true;
}
function handleRowClick(e,id){
  if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.tagName==='I') return;
  openFiche(id);
}
function toggleSelect(id){
  var idx=S.selected.indexOf(id);
  if(idx===-1) S.selected.push(id);
  else S.selected.splice(idx,1);
  renderListe(); updateMassBar();
}
function toggleAll(){
  var leads=filteredLeads();
  var allSel=leads.every(function(l){return S.selected.includes(l.id);});
  if(allSel){
    leads.forEach(function(l){var i=S.selected.indexOf(l.id);if(i>-1) S.selected.splice(i,1);});
  }else{
    leads.forEach(function(l){if(!S.selected.includes(l.id)) S.selected.push(l.id);});
  }
  renderListe(); updateMassBar();
}
function clearSelection(){S.selected=[];renderListe();updateMassBar();}
function deleteSelected(){
  if(!S.selected.length) return;
  if(!confirm('Supprimer '+S.selected.length+' lead(s) ?')) return;
  S.leads=S.leads.filter(function(l){return !S.selected.includes(l.id);});
  S.selected=[];
  saveData(); render();
}

/* ════════════════════════════════════════════════════════════
   PIPELINE
   ════════════════════════════════════════════════════════════ */
var COLUMNS=[
  {key:'nouveau',label:'Nouveau'},{key:'contacte',label:'Contacté'},
  {key:'proposition',label:'Proposition'},{key:'converti',label:'Converti'},
];
function renderPipeline(){
  var leads=filteredLeads();
  var html='<div class="pipeline-wrap">';
  COLUMNS.forEach(function(col){
    var colLeads=leads.filter(function(l){return l.statut===col.key;});
    html+='<div class="pipeline-col">'
      +'<div class="pipeline-col-header">'
      +'<span class="pipeline-col-title">'+badge(col.key)+'</span>'
      +'<span class="pipeline-col-count">'+colLeads.length+'</span>'
      +'</div>'
      +'<div class="pipeline-cards" data-col="'+col.key+'" '
      +'ondragover="event.preventDefault();this.classList.add(\'drag-over\')" '
      +'ondragleave="this.classList.remove(\'drag-over\')" '
      +'ondrop="onDrop(event,\''+col.key+'\')">';
    colLeads.forEach(function(l){
      var qi=idQ(l.id);
      var src=leadSource(l);
      html+='<div class="pipeline-card" draggable="true" data-id="'+l.id+'" '
        +'ondragstart="onDragStart(event,'+qi+')" ondragend="onDragEnd(event)">'
        +'<div class="pipeline-card-name">'+esc(l.prenom)+' '+esc(l.nom)+'</div>'
        +'<div class="pipeline-card-sub">'+produitBadge(l.produit)+' <span class="src-tag '+src+'">'+(src==='ads'?'Ads':'Web')+'</span></div>'
        +'<div class="pipeline-card-footer">'
        +'<span style="font-size:.75rem;color:var(--light)">'+fmtDate(l.date)+'</span>'
        +'<button class="btn btn-ghost btn-xs" onclick="openFiche('+qi+')"><i class="ti ti-eye"></i></button>'
        +'</div></div>';
    });
    if(colLeads.length===0) html+='<div style="text-align:center;padding:16px;color:var(--light);font-size:.78rem;">Aucun lead</div>';
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('view-pipeline').innerHTML=html;
}
function onDragStart(e,id){
  S.draggedId=id;
  e.dataTransfer.effectAllowed='move';
  setTimeout(function(){
    var el=document.querySelector('[data-id="'+id+'"]');
    if(el) el.classList.add('dragging');
  },0);
}
function onDragEnd(e){
  document.querySelectorAll('.pipeline-card.dragging').forEach(function(el){el.classList.remove('dragging');});
  document.querySelectorAll('.pipeline-cards').forEach(function(el){el.classList.remove('drag-over');});
}
function onDrop(e,colKey){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(S.draggedId===null||S.draggedId===undefined) return;
  var lead=S.leads.find(function(l){return l.id===S.draggedId;});
  if(lead&&lead.statut!==colKey){
    lead.historique.push({d:today(),a:'Statut → '+STATUT_LABELS[colKey],t:'statut'});
    lead.statut=colKey; lead._dirty=true;
    saveData();
    saveLeadToSupabase(lead).catch(function(){});
    renderPipeline();
  }
  S.draggedId=null;
}

function openFiche(id){
  if(S.view!=='fiche') S.returnView=S.view;

}
function backFromFiche(){ navTo(S.returnView||'web'); }

/* ── Produit data helpers ───────────────────────────────── */
function parseArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  try{return JSON.parse(v);}catch(e){return [];}
}
function fv(v){
  return (v!==null&&v!==undefined&&v!=='') ? esc(String(v)) : '—';
}
var FUNNEL_LABELS={
  montant:"Montant souhaité",
  situation:"Situation professionnelle",
  credits_en_cours:"Crédits en cours",
  prime_actuelle:"Prime mensuelle actuelle",
  nb_personnes:"Nombre de personnes",
  objectif:"Objectif",
  a_deja_pilier:"A déjà un 3ème pilier",
  montant_mensuel:"Montant mensuel d'épargne",
  heure_contact:"Heure de contact préférée"
};
function renderFunnelData(l){
  var d=l.dados||{};
  var keys=Object.keys(d);
  if(!keys.length) return '';
  var html='<div class="fiche-section"><div class="fiche-section-title">Données du funnel</div>'
    +'<div class="fiche-grid">';
  keys.forEach(function(k){
    html+='<div class="fiche-field"><label>'+esc(FUNNEL_LABELS[k]||k)+'</label><span>'+fv(d[k])+'</span></div>';
  });
  html+='</div></div>';
  return html;
}
function renderProduitData(l){
  var raw=l.raw||{};
  var pairs=[];

  if(l.produit==='credit'){
    pairs=[
      ['Montant demandé',    raw.montant           ? raw.montant+' CHF'           : '—'],
      ['Durée',              raw.duree             ? raw.duree+' mois'            : '—'],
      ['Objet du crédit',    fv(raw.objet_credit)],
      ['État civil',         fv(raw.etat_civil)],
      ['Salaire net',        raw.salaire_net        ? raw.salaire_net+' CHF'        : '—'],
      ['Salaire secondaire', raw.salaire_secondaire ? raw.salaire_secondaire+' CHF' : '—'],
      ['Loyer / logement',   raw.loyer              ? raw.loyer+' CHF'              : '—'],
      ['Primes maladie',     raw.primes_maladie     ? raw.primes_maladie+' CHF'     : '—'],
      ['Nationalité',        fv(raw.nationalite)],
      ['Permis',             fv(raw.permis)],
      ['Documents envoyés',  raw.docs_envoyes ? 'Oui' : 'Non']
    ];
    var enfants=parseArr(raw.enfants);
    if(enfants.length){
      pairs.push(['Enfants', enfants.map(function(e){
        return esc((e.prenom||'?')+(e.date_naissance?' ('+e.date_naissance+')':''));
      }).join('<br>')]);
    }
    if(raw.conjoint_prenom){
      pairs.push(['Conjoint',
        [raw.conjoint_prenom,raw.conjoint_nom,raw.conjoint_nationalite,raw.conjoint_permis]
          .filter(Boolean).map(esc).join(' · ')]);
    }

  } else if(l.produit==='assurance'){
    pairs=[
      ['Année de naissance',  fv(raw.annee_naissance)],
      ['Canton',              fv(raw.canton)],
      ['Nombre de personnes', fv(raw.nombre_personnes)],
      ['Médecin de famille',  fv(raw.medecin_famille)]
    ];
    var pers=parseArr(raw.personnes);
    if(pers.length){
      pairs.push(['Personnes assurées', pers.map(function(p,i){
        var pts=[];
        if(p.lamal_caisse)    pts.push('LaMal: '+p.lamal_caisse);
        if(p.lamal_prime)     pts.push('Prime: '+p.lamal_prime+' CHF');
        if(p.lamal_franchise) pts.push('Franchise: '+p.lamal_franchise);
        return esc('P'+(i+1)+': '+(pts.length?pts.join(' | '):'—'));
      }).join('<br>')]);
    }

  } else if(l.produit==='assurance-nouveau-arrive'){
    var npaloc=([raw.npa,raw.localite].filter(Boolean).join(' '))||'';
    var adr=[raw.adresse,npaloc].filter(Boolean).join(', ')||'—';
    pairs=[
      ['Date de naissance',       fv(raw.date_naissance)],
      ['Adresse',                 adr],
      ['Inscrit commune',         fv(raw.inscrit_commune)],
      ['Type de permis',          fv(raw.type_permis)],
      ["Date d'entrée en Suisse", fv(raw.date_entree)],
      ['Nombre de personnes',     fv(raw.nombre_personnes)]
    ];
    var padd=parseArr(raw.personnes_additionnelles);
    if(padd.length){
      pairs.push(['Personnes additionnelles', padd.map(function(p){
        return esc([p.prenom,p.nom,p.date_naissance].filter(Boolean).join(' '));
      }).join('<br>')]);
    }

  } else if(l.produit==='assurance-prenatale'){
    pairs=[
      ['Date de naissance (mère)',   fv(raw.date_naissance)],
      ["Date d'accouchement prévue", fv(raw.date_accouchement)],
      ['Prénom du bébé',             fv(raw.prenom_bebe)],
      ['Caisse LaMal',               fv(raw.caisse_lamal)],
      ['Caisse LCA',                 fv(raw.caisse_lca)],
      ['NPA / Localité',             [raw.npa,raw.localite].filter(Boolean).join(' ')||'—']
    ];

  } else if(l.produit==='pilier'){
    pairs=[
      ['Date de naissance',         fv(raw.date_naissance)],
      ['Canton',                    fv(raw.canton)],
      ['Situation professionnelle', fv(raw.situation_professionnelle)],
      ['Revenu annuel',             raw.revenu_annuel ? raw.revenu_annuel+' CHF' : '—'],
      ['Pilier existant',           fv(raw.pilier_existant)],
      ['Type de pilier',            fv(raw.type_pilier_existant)],
      ['Institution',               fv(raw.institution_pilier)],
      ['Montant versé',             fv(raw.montant_verse)],
      ['Périodicité',               fv(raw.periodicite_versement)],
      ['Objectif',                  fv(raw.objectif)],
      ['Commentaire',               fv(raw.commentaire)]
    ];

  } else if(l.produit==='patrimoine'){
    pairs=[
      ['Date de naissance',      fv(raw.date_naissance)],
      ['Code postal',            fv(raw.code_postal)],
      ['Souhaits',               fv(raw.souhaits)],
      ['Assurances souhaitées',  fv(raw.assurances_souhaitees)],
      ['Commentaire',            fv(raw.commentaire)]
    ];
    var aact=parseArr(raw.assurances_actuelles);
    if(aact.length){
      pairs.push(['Assurances actuelles', aact.map(function(a){
        return esc([a.type,a.compagnie].filter(Boolean).join(' — '));
      }).join('<br>')]);
    }
  }

  if(!pairs.length) return '';
  var html='<div class="fiche-section"><div class="fiche-section-title">Données du produit</div>'
    +'<div class="fiche-grid">';
  pairs.forEach(function(p){
    html+='<div class="fiche-field"><label>'+p[0]+'</label><span>'+p[1]+'</span></div>';
  });
  html+='</div></div>';
  return html;
}

/* ── Document viewer helpers ────────────────────────────── */
var FOLDER_LABELS={
  fiches_salaire:'Fiches de salaire',fiche_salaire:'Fiche de salaire',
  identite:'Pièce d\'identité',identite_conjoint:'Pièce d\'identité (conjoint)',
  poursuites:'Extrait de poursuites',impots:'Déclaration d\'impôts',
  contrat:'Contrat',contrats:'Contrats',autres:'Autres documents'
};
function folderLabel(name){
  if(Object.prototype.hasOwnProperty.call(FOLDER_LABELS,name)) return FOLDER_LABELS[name];
  return name.replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
}
async function loadDocumentos(leadId){
  var r=await fetch('/api/storage-list',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({leadId:leadId})
  });
  if(!r.ok) return {};
  var data=await r.json();
  if(!data.success||!data.pastas) return {};
  return data.pastas;
}
function renderDocumentosSection(grouped){
  var el=document.getElementById('docs-section');
  if(!el) return;
  var folders=Object.keys(grouped);
  var html='<div class="fiche-section-title">Documents</div>';
  if(!folders.length){html+='<p class="docs-empty">Aucun document disponible.</p>';el.innerHTML=html;return;}
  html+='<div class="docs-folders">';
  folders.forEach(function(folder){
    var files=grouped[folder];
    html+='<div class="docs-folder">';
    if(folder) html+='<div class="docs-folder-title">'+esc(folderLabel(folder))+'</div>';
    html+='<div class="docs-list">';
    files.forEach(function(f){
      html+='<div class="docs-item" data-url="'+esc(f.url)+'" onclick="window.open(this.dataset.url,\'_blank\')" title="'+esc(f.name)+'">'
        +'<span class="docs-item-icon"><i class="ti ti-file-text"></i></span>'
        +'<span class="docs-item-name">'+esc(f.name)+'</span></div>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  el.innerHTML=html;
}

function renderFiche(){
  var l=S.leads.find(function(x){return x.id===S.currentLeadId;});
  if(!l){document.getElementById('view-fiche').innerHTML='<p>Lead introuvable.</p>';return;}
  var statutOpts=Object.keys(STATUT_LABELS).map(function(k){
    return '<option value="'+k+'"'+(l.statut===k?' selected':'')+'>'+STATUT_LABELS[k]+'</option>';
  }).join('');
  var hist=l.historique.slice().reverse().map(function(h){
    return '<div class="hist-item"><div class="hist-dot '+h.t+'"></div>'
      +'<div><div class="hist-text">'+esc(h.a)+'</div><div class="hist-date">'+fmtDate(h.d)+'</div></div></div>';
  }).join('');
  var srcTag=leadSource(l)==='ads'?'Ads':'Web';
  var showDocs=(l._source!=='ads'&&l.produit==='credit'&&l.raw&&l.raw.docs_envoyes);
  var html='<div class="fiche-wrap">'
    +'<div class="fiche-header"><div class="fiche-header-left">'
    +'<h2>'+esc(l.prenom)+' '+esc(l.nom)+'</h2>'
    +'<div class="fiche-header-meta"><span>'+produitBadge(l.produit)+'</span>'
    +'<span><span class="src-tag '+leadSource(l)+'">'+srcTag+'</span></span>'
    +'<span><i class="ti ti-calendar"></i> '+fmtDate(l.date)+'</span></div></div>'
    +'<div class="fiche-header-right">'
    +'<select class="btn btn-ghost btn-sm" style="cursor:pointer;padding:6px 12px;" onchange="changeStatutFiche(this.value)">'+statutOpts+'</select>'
    +'<button class="btn btn-ghost btn-sm" onclick="planifierRdv()"><i class="ti ti-calendar-plus"></i> Planifier un RDV</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="exportPDF()"><i class="ti ti-file-text"></i> Export PDF</button>'
    +'<a class="btn btn-ghost btn-sm" href="mailto:'+esc(l.email)+'"><i class="ti ti-mail"></i> Email</a>'
    +'<button class="btn btn-ghost btn-sm" onclick="backFromFiche()"><i class="ti ti-arrow-left"></i> Retour</button>'
    +'</div></div>'
    +'<div class="fiche-body"><div class="fiche-main">'
    +'<div class="fiche-section"><div class="fiche-section-title">Coordonnées</div>'
    +'<div class="fiche-grid">'
    +'<div class="fiche-field"><label>Prénom</label><span>'+esc(l.prenom)+'</span></div>'
    +'<div class="fiche-field"><label>Nom</label><span>'+esc(l.nom)+'</span></div>'
    +'<div class="fiche-field"><label>Email</label><span>'+esc(l.email)+'</span></div>'
    +'<div class="fiche-field"><label>Téléphone</label><span>'+esc(l.telephone||'—')+'</span></div>'
    +'<div class="fiche-field"><label>Produit</label><span>'+(PRODUIT_LABELS[l.produit]||l.produit)+'</span></div>'
    +'<div class="fiche-field"><label>Date d\'entrée</label><span>'+fmtDate(l.date)+'</span></div>'
    +'</div></div>'
    +(l._source==='ads' ? renderFunnelData(l) : renderProduitData(l))
    +'</div>'
    +'<div class="fiche-side"><div class="fiche-section">'
    +'<div class="fiche-section-title">Historique</div>'
    +'<div class="historique-list">'+hist+'</div>'
    +'</div></div></div>'
    +(showDocs
        ? '<div id="docs-section" class="fiche-docs">'
          +'<div class="fiche-section-title">Documents</div>'
          +'<div class="docs-loading"><div class="spinner" style="width:16px;height:16px;border-width:2px;flex-shrink:0;"></div>Chargement des documents…</div>'
          +'</div>'
        : '')
    +'</div>';
  document.getElementById('view-fiche').innerHTML=html;
  if(showDocs){
    loadDocumentos(l.id).then(function(grouped){renderDocumentosSection(grouped);}).catch(function(){
      var el=document.getElementById('docs-section');
      if(el) el.innerHTML='<div class="fiche-section-title">Documents</div>'
        +'<p class="docs-empty" style="color:var(--red);">Erreur lors du chargement.</p>';
    });
  }
}
function saveLeadToSupabase(lead){
  if(lead._local) return Promise.resolve();
  if(lead._source==='ads'){
    // Unified "leads" table — statut stored lowercase, like the funnels write it
    return fetch('/api/lead-update',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        id:             lead.id,
        notes:          lead.notes||null,
        follow_up_date: lead.followup||null,

      })
    }).then(function(r){return r.json();}).then(function(d){
      if(!d.success) throw new Error(d.error||'Erreur Supabase');
    });

  return fetch('/api/leads-update',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      id:             lead.id,
      produit:        lead.produit,
      notes:          lead.notes||null,
      follow_up_date: lead.followup||null,
      statut:         lead.statut.charAt(0).toUpperCase()+lead.statut.slice(1)
    })
  }).then(function(r){return r.json();}).then(function(d){
    if(!d.success) throw new Error(d.error||'Erreur Supabase');
  });
}
function changeStatutFiche(val){

/* ════════════════════════════════════════════════════════════
   CALENDRIER
   ════════════════════════════════════════════════════════════ */
function pad2(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function startOfWeek(d){var x=new Date(d);var day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function hm(t){return t?String(t).slice(0,5):'';}
function startHour(r){return r.heure_debut?parseInt(String(r.heure_debut).slice(0,2),10):8;}
function rdvsForDate(ds){
  return S.rdvs.filter(function(r){return (r.date_rdv||'').slice(0,10)===ds;})
    .sort(function(a,b){return (a.heure_debut||'').localeCompare(b.heure_debut||'');});
}
function calShift(dir){
  var d=new Date(S.calCursor);
  if(S.calView==='mois') d.setMonth(d.getMonth()+dir);
  else if(S.calView==='semaine') d.setDate(d.getDate()+7*dir);
  else d.setDate(d.getDate()+dir);
  S.calCursor=d; renderCalendrier();
}
function calToday(){ S.calCursor=new Date(); renderCalendrier(); }
function setCalView(v){ S.calView=v; renderCalendrier(); }
function calTitle(){
  var d=S.calCursor;
  if(S.calView==='mois') return MOIS[d.getMonth()]+' '+d.getFullYear();
  if(S.calView==='semaine'){
    var s=startOfWeek(d);var e=new Date(s);e.setDate(s.getDate()+6);
    return fmtDate(ymd(s))+' – '+fmtDate(ymd(e));
  }
  return JOURS_LONG[(d.getDay()+6)%7]+' '+fmtDate(ymd(d));
}
function viewBtn(v,label){
  return '<button class="cal-view-btn'+(S.calView===v?' active':'')+'" onclick="setCalView(\''+v+'\')">'+label+'</button>';
}
function renderCalendrier(){
  var el=document.getElementById('view-calendrier');
  var toolbar='<div class="cal-toolbar">'
    +'<div class="cal-nav">'
    +'<button class="btn btn-ghost btn-sm" onclick="calShift(-1)"><i class="ti ti-chevron-left"></i></button>'
    +'<button class="btn btn-ghost btn-sm" onclick="calToday()">Aujourd\'hui</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="calShift(1)"><i class="ti ti-chevron-right"></i></button>'
    +'</div>'
    +'<div class="cal-title">'+calTitle()+'</div>'
    +'<div style="flex:1"></div>'
    +'<div class="cal-views">'+viewBtn('mois','Mensuel')+viewBtn('semaine','Semaine')+viewBtn('jour','Jour')+'</div>'
    +'<button class="btn btn-primary btn-sm" onclick="openRdvModal({date:today()})"><i class="ti ti-plus"></i> Nouveau RDV</button>'
    +'</div>';
  var body = S.calView==='mois'?calMonth():(S.calView==='semaine'?calWeek():calDay());
  el.innerHTML=toolbar+body;
}
function calMonth(){
  var d=S.calCursor;var y=d.getFullYear();var m=d.getMonth();
  var first=new Date(y,m,1);var start=startOfWeek(first);var todayStr=today();
  var html='<div class="cal-month"><div class="cal-weekdays">';
  JOURS.forEach(function(j){html+='<div class="cal-weekday">'+j+'</div>';});
  html+='</div><div class="cal-grid">';
  for(var i=0;i<42;i++){
    var cd=new Date(start);cd.setDate(start.getDate()+i);
    var ds=ymd(cd);var out=cd.getMonth()!==m;
    html+='<div class="cal-cell'+(out?' out':'')+(ds===todayStr?' today':'')+'" onclick="openRdvModal({date:\''+ds+'\'})">'
      +'<div class="cal-cell-num">'+cd.getDate()+'</div>';
    rdvsForDate(ds).forEach(function(r){
      html+='<div class="cal-chip" onclick="event.stopPropagation();openRdvById('+idQ(r.id)+')" title="'+esc(r.titre)+'">'+esc(hm(r.heure_debut))+' '+esc(r.titre)+'</div>';
    });
    html+='</div>';
  }
  html+='</div></div>';
  return html;
}
function calWeek(){
  var s=startOfWeek(S.calCursor);var todayStr=today();var H0=8,H1=20;
  var days=[];for(var i=0;i<7;i++){var d=new Date(s);d.setDate(s.getDate()+i);days.push(d);}
  var html='<div class="cal-week-scroll"><div class="cal-week">';
  html+='<div class="cal-week-corner"></div>';
  days.forEach(function(d){
    html+='<div class="cal-week-head'+(ymd(d)===todayStr?' today':'')+'">'+JOURS[(d.getDay()+6)%7]+'<br><b>'+d.getDate()+'</b></div>';
  });
  for(var h=H0;h<=H1;h++){
    html+='<div class="cal-hour-label">'+pad2(h)+':00</div>';
    days.forEach(function(d){
      var ds=ymd(d);
      html+='<div class="cal-slot" onclick="openRdvModal({date:\''+ds+'\',debut:\''+pad2(h)+':00\'})">';
      rdvsForDate(ds).filter(function(r){return startHour(r)===h;}).forEach(function(r){
        html+='<div class="cal-chip" onclick="event.stopPropagation();openRdvById('+idQ(r.id)+')" title="'+esc(r.titre)+'">'+esc(hm(r.heure_debut))+' '+esc(r.titre)+'</div>';
      });
      html+='</div>';
    });
  }
  html+='</div></div>';
  return html;
}
function calDay(){
  var ds=ymd(S.calCursor);var H0=8,H1=20;var rdvs=rdvsForDate(ds);
  var html='<div class="cal-day">';
  for(var h=H0;h<=H1;h++){
    html+='<div class="cal-day-row"><div class="cal-day-hour">'+pad2(h)+':00</div>'
      +'<div class="cal-day-events" onclick="openRdvModal({date:\''+ds+'\',debut:\''+pad2(h)+':00\'})">';
    rdvs.filter(function(r){return startHour(r)===h;}).forEach(function(r){
      html+='<div class="cal-event" onclick="event.stopPropagation();openRdvById('+idQ(r.id)+')">'
        +'<div class="cal-event-time">'+esc(hm(r.heure_debut))+(r.heure_fin?' – '+esc(hm(r.heure_fin)):'')+'</div>'
        +'<div class="cal-event-title">'+esc(r.titre)+'</div>'
        +(r.lead_nom?'<div class="cal-event-sub"><i class="ti ti-user"></i> '+esc(r.lead_nom)+(r.lead_produit?' · '+esc(PRODUIT_LABELS[r.lead_produit]||r.lead_produit):'')+'</div>':'')
        +(r.notes?'<div class="cal-event-sub">'+esc(r.notes)+'</div>':'')
        +'</div>';
    });
    html+='</div></div>';
  }
  html+='</div>';
  return html;
}

/* ── RDV modal ──────────────────────────────────────────── */
function setVal(id,v){var el=document.getElementById(id);if(el) el.value=(v==null?'':v);}
function val(id){var el=document.getElementById(id);return el?el.value:'';}
function openRdvById(id){var r=S.rdvs.find(function(x){return x.id===id;});if(r) openRdvModal({rdv:r});}
var DUREE_OPTS=[30,45,60,90,120];
function addMinutes(hhmm,mins){
  var p=String(hhmm).split(':');
  var d=new Date(2000,0,1,parseInt(p[0],10)||0,parseInt(p[1],10)||0);
  d.setMinutes(d.getMinutes()+mins);
  return pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function diffMinutes(deb,fin){
  if(!deb||!fin) return 60;
  var a=String(deb).split(':'),b=String(fin).split(':');
  var m=(parseInt(b[0],10)*60+parseInt(b[1],10))-(parseInt(a[0],10)*60+parseInt(a[1],10));
  return m>0?m:60;
}
function openRdvModal(opts){
  opts=opts||{};
  var rdv=opts.rdv;
  S.editingRdvId=rdv?rdv.id:null;
  document.getElementById('rdv-modal-title').innerHTML=rdv
    ?'<i class="ti ti-calendar"></i> Modifier le RDV'
    :'<i class="ti ti-calendar-plus"></i> Nouveau RDV';
  // Associated lead state
  if(rdv&&(rdv.lead_id||rdv.lead_nom)) S.rdvLead={id:rdv.lead_id,nom:rdv.lead_nom,produit:rdv.lead_produit};
  else if(opts.lead) S.rdvLead=opts.lead;
  else S.rdvLead=null;
  // Client field = associated lead name, or existing rdv titre, or free text
  var clientVal = rdv ? (rdv.lead_nom||rdv.titre||'') : (opts.lead?opts.lead.nom:(opts.clientName||''));
  setVal('rdv-client', clientVal);
  setVal('rdv-date',  rdv?rdv.date_rdv:(opts.date||today()));
  setVal('rdv-debut', rdv?(rdv.heure_debut?hm(rdv.heure_debut):''):(opts.debut||''));
  var duree = rdv ? diffMinutes(hm(rdv.heure_debut),hm(rdv.heure_fin)) : 60;
  if(DUREE_OPTS.indexOf(duree)===-1) duree=60;
  setVal('rdv-duree', String(duree));
  setVal('rdv-notes', rdv?(rdv.notes||''):'');
  document.getElementById('rdv-lead-list').classList.remove('show');
  updateRdvHint();
  document.getElementById('rdv-delete-btn').style.display=rdv?'':'none';
  openModal('modal-rdv');
}
function updateRdvHint(){
  var hint=document.getElementById('rdv-client-hint');
  if(S.rdvLead&&S.rdvLead.id){
    hint.innerHTML='<i class="ti ti-user-check"></i> Lead associé'
      +(S.rdvLead.produit?' · '+esc(PRODUIT_LABELS[S.rdvLead.produit]||S.rdvLead.produit):'');
    hint.style.display='';
  }else{
    hint.style.display='none';
  }
}
function filterRdvLeads(){
  // Typing breaks any previous association (until a lead is picked again)
  S.rdvLead=null;
  updateRdvHint();
  var q=document.getElementById('rdv-client').value.toLowerCase().trim();
  var list=document.getElementById('rdv-lead-list');
  if(!q){list.classList.remove('show');list.innerHTML='';return;}
  var matches=S.leads.filter(function(l){
    return (l.prenom+' '+l.nom+' '+l.email).toLowerCase().includes(q);
  }).slice(0,8);
  if(!matches.length){list.classList.remove('show');list.innerHTML='';return;}
  list.innerHTML=matches.map(function(l){
    return '<div class="lead-search-opt" onclick="selectRdvLead('+idQ(l.id)+')">'
      +esc((l.prenom+' '+l.nom).trim())+' · '+esc(PRODUIT_LABELS[l.produit]||l.produit)+'</div>';
  }).join('');
  list.classList.add('show');
}
function selectRdvLead(id){
  var l=S.leads.find(function(x){return x.id===id;});
  if(!l) return;
  S.rdvLead={id:l.id,nom:(l.prenom+' '+l.nom).trim(),produit:l.produit};
  setVal('rdv-client', S.rdvLead.nom);
  document.getElementById('rdv-lead-list').classList.remove('show');
  updateRdvHint();
}
function planifierRdv(){
  var l=S.leads.find(function(x){return x.id===S.currentLeadId;});
  if(!l) return;
  var nom=(l.prenom+' '+l.nom).trim();
  openRdvModal({date:today(),lead:{id:l.id,nom:nom,produit:l.produit}});
}
function rdvLeadId(){
  if(!S.rdvLead||!S.rdvLead.id) return null;
  return String(S.rdvLead.id).indexOf('local-')===0 ? null : S.rdvLead.id;
}
function createLocalWebLead(name){
  var parts=name.trim().split(/\s+/);
  var prenom=parts.shift()||name;
  var nom=parts.join(' ');
  var l={
    id:'local-'+Date.now(),
    prenom:prenom,nom:nom,email:'',telephone:'',
    produit:'',statut:'nouveau',_source:'web',
    date:today(),followup:'',notes:'',
    historique:[{d:today(),a:'Lead créé',t:'create'}],
    _local:true
  };
  S.leads.unshift(l);
  saveData();
  return l;
}
function saveRdv(){
  var name=val('rdv-client').trim();
  var date=val('rdv-date');
  if(!name){alert('Le client est obligatoire.');return;}
  if(!date){alert('La date est obligatoire.');return;}

  // New RDV with free text not matching any lead → propose creating a lead
  if(!S.editingRdvId && !(S.rdvLead&&S.rdvLead.id)){
    var ok=confirm('« '+name+' » ne correspond à aucun lead existant.\n\nCréer un nouveau lead ?');
    if(ok){
      var newLead=createLocalWebLead(name);
      S.rdvLead={id:newLead.id,nom:(newLead.prenom+' '+newLead.nom).trim(),produit:newLead.produit||null};
    }
  }

  var duree=parseInt(val('rdv-duree'),10)||60;
  var debut=val('rdv-debut')||null;
  var fin=debut?addMinutes(debut,duree):null;
  var payload={
    titre:(S.rdvLead&&S.rdvLead.nom)?S.rdvLead.nom:name,
    date_rdv:date,
    heure_debut:debut,
    heure_fin:fin,
    lead_id:rdvLeadId(),
    lead_nom:(S.rdvLead&&S.rdvLead.nom)?S.rdvLead.nom:name,
    lead_produit:S.rdvLead?S.rdvLead.produit:null,
    notes:val('rdv-notes').trim()||null
  };
  var btn=document.getElementById('rdv-save-btn'); btn.disabled=true;
  var req=S.editingRdvId
    ? fetch('/api/rdv?id='+encodeURIComponent(S.editingRdvId),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    : fetch('/api/rdv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  req.then(function(r){return r.json();}).then(function(d){
    if(!d.success) throw new Error(d.error||'Erreur');
    return loadRdvs();
  }).then(function(){
    btn.disabled=false;
    closeModal('modal-rdv');
    if(S.view!=='calendrier'){ navTo('calendrier'); } else { renderCalendrier(); }
  }).catch(function(){
    btn.disabled=false;
    alert('Erreur lors de l\'enregistrement du RDV.');
  });
}
function deleteRdv(){
  if(!S.editingRdvId) return;
  if(!confirm('Supprimer ce rendez-vous ?')) return;
  fetch('/api/rdv?id='+encodeURIComponent(S.editingRdvId),{method:'DELETE'})
    .then(function(r){return r.json();}).then(function(d){
      if(!d.success) throw new Error();
      return loadRdvs();
    }).then(function(){
      closeModal('modal-rdv');
      renderCalendrier();
    }).catch(function(){
      alert('Erreur lors de la suppression.');
    });
}

/* ════════════════════════════════════════════════════════════
   STATISTIQUES
   ════════════════════════════════════════════════════════════ */
var CHARTS={};
function destroyCharts(){
  Object.keys(CHARTS).forEach(function(k){try{CHARTS[k].destroy();}catch(e){}});
  CHARTS={};
}
function chartCard(title,id){
  return '<div class="chart-card"><h3>'+title+'</h3><div style="position:relative;height:260px;"><canvas id="'+id+'"></canvas></div></div>';
}
function renderStatsPage(){
  var el=document.getElementById('view-stats');
  var all=S.leads;
  var ym=today().slice(0,7);
  var ceMois=all.filter(function(l){return (l.date||'').slice(0,7)===ym;}).length;
  var conv=all.filter(function(l){return l.statut==='converti';}).length;
  var fu=all.filter(function(l){return !!l.followup;}).length;
  var taux=all.length?Math.round(conv/all.length*100):0;
  var cards=[
    {label:'Total leads',num:all.length},
    {label:'Leads ce mois',num:ceMois},
    {label:'Taux de conversion',num:taux+'%'},
    {label:'En follow-up',num:fu}
  ];
  var html='<div class="stats-row">'+cards.map(function(c){
    return '<div class="stat-card" style="cursor:default"><div class="stat-label">'+c.label+'</div><div class="stat-num">'+c.num+'</div></div>';
  }).join('')+'</div>';
  html+='<div class="charts-grid">'
    +chartCard('Leads par mois (6 derniers mois)','chart-mois')
    +chartCard('Web vs Ads','chart-source')
    +chartCard('Répartition par produit','chart-produit')
    +chartCard('Répartition par statut','chart-statut')
    +'</div>';
  el.innerHTML=html;
  if(typeof Chart==='undefined'){
    el.innerHTML+='<p style="color:var(--muted);text-align:center;margin-top:16px;">Les graphiques n\'ont pas pu être chargés (connexion requise).</p>';
    return;
  }
  drawCharts(all);
}
function barOpts(horiz){
  return {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    indexAxis:horiz?'y':'x',
    scales:{x:{ticks:{precision:0},beginAtZero:true},y:{ticks:{precision:0},beginAtZero:true}}};
}
function pieOpts(){
  return {responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}};
}
function drawCharts(all){
  destroyCharts();
  // Leads par mois
  var labels=[],counts=[],now=new Date();
  for(var i=5;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var key=d.getFullYear()+'-'+pad2(d.getMonth()+1);
    labels.push(MOIS[d.getMonth()].slice(0,3)+' '+String(d.getFullYear()).slice(2));
    counts.push(all.filter(function(l){return (l.date||'').slice(0,7)===key;}).length);
  }
  CHARTS.mois=new Chart(document.getElementById('chart-mois'),{
    type:'bar',data:{labels:labels,datasets:[{label:'Leads',data:counts,backgroundColor:'#2B2FD4',borderRadius:6}]},options:barOpts()
  });
  // Web vs Ads
  var web=all.filter(function(l){return leadSource(l)==='web';}).length;
  var ads=all.filter(function(l){return leadSource(l)==='ads';}).length;
  CHARTS.source=new Chart(document.getElementById('chart-source'),{
    type:'doughnut',data:{labels:['Web','Ads'],datasets:[{data:[web,ads],backgroundColor:['#2B2FD4','#16a34a']}]},options:pieOpts()
  });
  // Par produit
  var pk=Object.keys(PRODUIT_LABELS);
  CHARTS.produit=new Chart(document.getElementById('chart-produit'),{
    type:'bar',
    data:{labels:pk.map(function(k){return PRODUIT_LABELS[k];}),
      datasets:[{label:'Leads',data:pk.map(function(k){return all.filter(function(l){return l.produit===k;}).length;}),
      backgroundColor:['#2B2FD4','#4F54E8','#7c3aed','#d97706','#16a34a','#f97316'],borderRadius:6}]},
    options:barOpts(true)
  });
  // Par statut
  var sk=['nouveau','contacte','proposition','converti','perdu'];
  CHARTS.statut=new Chart(document.getElementById('chart-statut'),{
    type:'doughnut',
    data:{labels:sk.map(function(k){return STATUT_LABELS[k];}),
      datasets:[{data:sk.map(function(k){return all.filter(function(l){return l.statut===k;}).length;}),
      backgroundColor:['#2B2FD4','#f97316','#7c3aed','#16a34a','#6b7280']}]},
    options:pieOpts()
  });
}

  var rows=leads.map(function(l){
    return [l.nom,l.prenom,l.email,l.telephone,PRODUIT_LABELS[l.produit]||l.produit,
      (leadSource(l)==='ads'?'Ads':'Web'),
      STATUT_LABELS[l.statut]||l.statut,l.date,l.notes].map(function(v){return '"'+(v||'').replace(/"/g,'""')+'"';}).join(',');
  });
  var csv='﻿'+cols.map(function(c){return '"'+c+'"';}).join(',')+'\n'+rows.join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='leads_romero_'+today()+'.csv';a.click();
  URL.revokeObjectURL(url);
}

/* ════════════════════════════════════════════════════════════
   UTILS
   ════════════════════════════════════════════════════════════ */
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

document.querySelectorAll('.modal-overlay').forEach(function(el){
  el.addEventListener('click',function(e){if(e.target===el) closeModal(el.id);});
});

/* ── Boot ─────────────────────────────────────────────────── */
checkAuth();
</script>
